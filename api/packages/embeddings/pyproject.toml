[project]
name = "techmunkak-embeddings"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "martinjoo", email = "martin@martinjoo.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "langchain-chroma>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langchain[mistralai,openai]>=1.3.18",
    "techmunkak-core",
]

[project.scripts]
embed = "techmunkak.embeddings.run:embed"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
techmunkak-core = { workspace = true }

[tool.uv.build-backend]
module-name = "techmunkak.embeddings"
