[project]
name = "techmunkak-nlp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "martinjoo", email = "martin@martinjoo.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "spacy>=3.8.16",
    "en_core_web_trf @ https://github.com/explosion/spacy-models/releases/download/en_core_web_trf-3.8.0/en_core_web_trf-3.8.0-py3-none-any.whl",
    "spacy-lookups-data>=1.0.3,<1.1.0",
    "techmunkak-core",
]

[project.scripts]
train = "techmunkak.nlp.run:train"
inference = "techmunkak.nlp.run:inference"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "techmunkak.nlp"

[tool.uv.sources]
techmunkak-core = { workspace = true }
