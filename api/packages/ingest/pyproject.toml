[project]
name = "techmunkak-ingest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "martinjoo", email = "martin@martinjoo.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "techmunkak-core"
]

[project.scripts]
ingest = "techmunkak.ingest.run:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
techmunkak-core = { workspace = true }

[tool.uv.build-backend]
module-name = "techmunkak.ingest"