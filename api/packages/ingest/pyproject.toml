[project]
name = "techmunkak-ingest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "martinjoo", email = "martin@martinjoo.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "apache-airflow-task-sdk>=1.3.1,<2",
    "boto3>=1.43.78",
    "python-levenshtein>=0.27.4",
    "techmunkak-core",
]

[project.scripts]
ingest = "techmunkak.ingest.run:main"
refresh_exchange_rates = "techmunkak.ingest.run:run_refresh_exchange_rates"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
techmunkak-core = { workspace = true }

[tool.uv.build-backend]
module-name = "techmunkak.ingest"
