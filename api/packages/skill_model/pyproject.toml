[project]
name = "techmunkak-skill-model"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "martinjoo", email = "martin@martinjoo.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "techmunkak-core",
    "spacy>=3.8.16",
    "spacy-lookups-data>=1.0.3,<1.1.0"
]

[project.scripts]
train = "techmunkak.enrich.run:train"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
techmunkak-core = { workspace = true }

[tool.uv.build-backend]
module-name = "techmunkak.skill_model"
