version: 2

models:
  - name: int_justjoinit__job_skills
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - url
            - skill
    columns:
      - name: url
        data_tests:
          - not_null
          - not_empty
      - name: skill
        data_tests:
          - not_null
          - not_empty
      - name: required
        data_tests:
          - not_null
  - name: int_justjoinit__job_salaries
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - url
            - contract_type
    columns:
      - name: url
        data_tests:
          - not_null
          - not_empty
      - name: bottom
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 1000000
      - name: top
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 1000000
      - name: period
        data_tests:
          - not_null
          - not_empty
          - accepted_values:
              values: ['hour', 'month', 'day']
      - name: currency
        data_tests:
          - not_null
          - not_empty
      - name: contract_type
        data_tests:
          - not_null
          - not_empty
          - accepted_values:
              values: ['b2b', 'permanent']
