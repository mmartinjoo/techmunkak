version: 2

models:
  - name: int_job_versions
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - job_key
              - version
              - contract_type
    columns:
      - name: job_key
        data_tests:
          - not_null
          - not_empty
      - name: title
        data_tests:
          - not_null
          - not_empty
      - name: description
        data_tests:
          - not_null
          - not_empty
      - name: company_name
        data_tests:
          - not_null
          - not_empty
      - name: seniority
        data_tests:
          - not_null
          - not_empty
      - name: country_code
        data_tests:
          - not_null
          - not_empty
      - name: posted_at
        data_tests:
          - not_null
      - name: expires_at
        data_tests:
          - not_null
      - name: required_skills
        data_tests:
          - not_null
      - name: optional_skills
      - name: monthly_salary_bottom
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 100000000
      - name: monthly_salary_top
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 100000000
      - name: salary_period
        data_tests:
          - accepted_values:
              values: ['hour', 'month', 'day']
      - name: currency_code
        data_tests:
          - not_null
          - not_empty
      - name: contract_type
        data_tests:
          - not_null
          - not_empty
          - accepted_values:
              values: ['b2b', 'permanent']
      - name: url
        data_tests:
          - not_null
          - not_empty
      - name: version
        data_tests:
          - not_null
  - name: int_jobs
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - job_key
              - contract_type
    columns:
      - name: job_key
        data_tests:
          - not_null
          - not_empty
      - name: title
        data_tests:
          - not_null
          - not_empty
      - name: description
        data_tests:
          - not_null
          - not_empty
      - name: company_name
        data_tests:
          - not_null
          - not_empty
      - name: seniority
        data_tests:
          - not_null
          - not_empty
      - name: country_code
        data_tests:
          - not_null
          - not_empty
      - name: posted_at
        data_tests:
          - not_null
      - name: expires_at
        data_tests:
          - not_null
      - name: required_skills
        data_tests:
          - not_null
      - name: optional_skills
      - name: monthly_salary_bottom
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 100000000
      - name: monthly_salary_top
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 100000000
      - name: salary_period
        data_tests:
          - accepted_values:
              values: ['hour', 'month', 'day']
      - name: currency_code
        data_tests:
          - not_null
          - not_empty
      - name: contract_type
        data_tests:
          - not_null
          - not_empty
          - accepted_values:
              values: ['b2b', 'permanent']
      - name: url
        data_tests:
          - not_null
          - not_empty
  - name: int_skill_candidates
    columns:
      - name: skill_key
        data_tests:
          - not_null
          - not_empty
          - unique
      - name: name
        data_tests:
          - not_null
          - not_empty
  - name: dim_skill
    columns:
      - name: name
        data_tests:
          - not_null
          - not_empty
      - name: slug
        data_tests:
          - not_null
          - not_empty
      - name: skill_key
        data_tests:
          - not_null
          - not_empty
          - unique
  - name: dim_company
    columns:
      - name: name
        data_tests:
          - not_null
          - not_empty
      - name: size
      - name: company_key
        data_tests:
          - not_null
          - not_empty
          - unique
  - name: dim_country
    columns:
      - name: name
        data_tests:
          - not_null
          - not_empty
      - name: country_key
        data_tests:
          - not_null
          - not_empty
          - unique
  - name: dim_contract_type
    columns:
      - name: name
        data_tests:
          - not_null
          - not_empty
      - name: contract_type_key
        data_tests:
          - not_null
          - not_empty
          - unique
  - name: fact_job
    columns:
      - name: url
        data_tests:
          - not_null
          - not_empty
      - name: title
        data_tests:
          - not_null
          - not_empty
      - name: description
        data_tests:
          - not_null
          - not_empty
      - name: monthly_salary_bottom
      - name: monthly_salary_top
      - name: currency_code
        data_test:
          - not_null
          - not_empty
      - name: company_key
        data_tests:
          - not_null
          - not_empty
          - relationships:
              arguments:
                to: ref('dim_company')
                field: company_key
      - name: seniority_key
        data_tests:
          - not_null
          - not_empty
          - relationships:
              arguments:
                to: ref('dim_seniority')
                field: seniority_key
      - name: contract_type_key
        data_tests:
          - not_null
          - not_empty
          - relationships:
              arguments:
                to: ref('dim_contract_type')
                field: contract_type_key
      - name: country_key
        data_tests:
          - not_null
          - not_empty
          - relationships:
              arguments:
                to: ref('dim_country')
                field: country_key