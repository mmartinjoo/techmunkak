version: 2

models:
  - name: int_nofluffjobs__job_regions
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - url
            - region
    columns:
      - name: url
        data_tests:
          - not_null
          - not_empty
      - name: region
        data_tests:
          - not_null
          - not_empty
  - name: int_nofluffjobs__job_salaries
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - url
            - contract_type
    columns:
      - name: url
        data_tests:
          - not_null
          - not_empty
      - name: bottom
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 100000000
      - name: top
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 100000000
      - name: period
        data_tests:
          - not_null
          - not_empty
          - accepted_values:
              values: ['hour', 'month', 'day']
      - name: currency
        data_tests:
          - not_null
          - not_empty
      - name: contract_type
        data_tests:
          - not_null
          - not_empty
          - accepted_values:
              values: ['b2b', 'permanent']

